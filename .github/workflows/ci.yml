name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, test, fuzz
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: api
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          go tool cover -html=coverage.out -o coverage.html
          { echo '### API coverage'; echo '```'; go tool cover -func=coverage.out | tail -1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Fuzz number parsing
        run: go test -run='^$' -fuzz=FuzzParse -fuzztime=20s ./internal/calc
      - uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: api/coverage.html

  web:
    name: Web · lint, typecheck, test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Validate the OpenAPI contract
        run: npx --yes @redocly/cli@2.62.1 lint ../api/openapi.yaml --config ../api/redocly.yaml
      - name: Generated API types match the contract
        run: npm run gen && git diff --exit-code -- src/features/calculator/api/schema.gen.ts
      - name: Test with coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Coverage summary
        run: |
          node -e 'const t=require("./coverage/coverage-summary.json").total;console.log(`### Web coverage\n\nstatements ${t.statements.pct}% · branches ${t.branches.pct}% · functions ${t.functions.pct}% · lines ${t.lines.pct}%`)' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: web/coverage

  e2e:
    name: Docker · build and end-to-end
    runs-on: ubuntu-24.04
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          CI: "true"
      - name: Service logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

# Serves the built SPA and proxies the API, so the browser sees one origin
# (no CORS in production).

# Hashed build assets never change; everything else must be revalidated.
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Docker's embedded DNS. Resolving per request (via the variable below)
    # keeps the proxy working if the api container restarts with a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/problem+json application/yaml image/svg+xml;
    gzip_min_length 1024;

    # add_header in a location would drop these, so locations only use the map above.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # The API's own docs (Scalar loads from a CDN, so it keeps the API's headers).
    location = /docs         { proxy_pass $api_upstream; }
    location = /openapi.yaml { proxy_pass $api_upstream; }
    location = /healthz      { proxy_pass $api_upstream; }

    # A missing asset is a 404, not the SPA shell.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
